services:
  app:
    image: ghcr.io/rolfwalker71-commits/aicrochetmaster:latest
    build: .
    ports:
      - "3010:3010"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_PIN: ${APP_PIN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATA_DIR: /app/data
    volumes:
      - crochet-data:/app/data

volumes:
  crochet-data:
